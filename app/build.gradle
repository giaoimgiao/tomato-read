plugins {
    id 'com.android.application'
}
android {
    namespace 'com.giaoimgiao.tomatoread'
    compileSdk 34
    defaultConfig {
        applicationId 'com.giaoimgiao.tomatoread'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        debug {
            storeFile file('../keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}
dependencies {
    compileOnly files('libs/XposedBridgeApi-82.jar')
}